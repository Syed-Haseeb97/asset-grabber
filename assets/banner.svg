<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseScan {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.7; }
      100% { transform: translateY(280px); opacity: 0.1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .scanner-line {
      animation: pulseScan 3.5s ease-in-out infinite;
    }
    .cursor-blink {
      animation: blink 0.9s infinite;
    }
    .floating-pill {
      animation: floatBadge 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="100" x2="1000" y2="100"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="220" x2="1000" y2="220"/>
    <line x1="0" y1="280" x2="1000" y2="280"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="560" y1="0" x2="560" y2="320"/>
    <line x1="760" y1="0" x2="760" y2="320"/>
  </g>

  <!-- Animated Scanner Bar -->
  <line x1="40" y1="20" x2="960" y2="20" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)" class="scanner-line"/>

  <!-- Top Terminal Header Dots -->
  <circle cx="36" cy="32" r="6" fill="#ef4444" />
  <circle cx="56" cy="32" r="6" fill="#f59e0b" />
  <circle cx="76" cy="32" r="6" fill="#10b981" />
  <text x="105" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="600">ASSET-GRABBER // BROWSER FORENSICS &amp; ASSET RIPPER</text>

  <!-- Main Title -->
  <text x="60" y="115" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">
    ASSET GRABBER <tspan fill="url(#accentGrad)">2.0</tspan>
  </text>

  <!-- Subtitle with sarcasm -->
  <text x="62" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Because if you didn't want the internet downloading your production assets, you shouldn't have uploaded them.
  </text>

  <!-- Interactive Terminal Simulation Box -->
  <rect x="60" y="180" width="880" height="105" rx="10" fill="#030712" stroke="#1f2937" stroke-width="1.2"/>

  <text x="85" y="212" fill="#10b981" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700">
    $ asset-grabber inspect --deep https://victim-startup.io
  </text>

  <text x="85" y="236" fill="#38bdf8" font-family="'Courier New', Courier, monospace" font-size="12">
    [✓] Extracted 412 images, 18 videos, 4 HLS streams, 34 PDFs... bundled into ZIP.
  </text>

  <text x="85" y="258" fill="#f43f5e" font-family="'Courier New', Courier, monospace" font-size="12">
    [!] AUDIT ALERT: Found /.env exposed (contains STRIPE_SECRET_KEY, OPENAI_API_KEY)
    <tspan fill="#f59e0b" class="cursor-blink"> █</tspan>
  </text>

  <!-- Floating Feature Badges on right side -->
  <g class="floating-pill">
    <rect x="740" y="75" width="200" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="840" y="97" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ 0-CLICK BULK EXTRACT</text>
  </g>
  <g class="floating-pill" style="animation-delay: -2s;">
    <rect x="740" y="120" width="200" height="34" rx="17" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
    <text x="840" y="142" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🚨 DEV LEAK HUNTER</text>
  </g>
</svg>
