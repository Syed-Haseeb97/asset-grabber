<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Card 1: Bulk Vacuum -->
  <rect x="10" y="10" width="275" height="220" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="45" cy="45" r="18" fill="#0284c7" opacity="0.2"/>
  <text x="45" y="52" fill="#38bdf8" font-size="20" text-anchor="middle">📦</text>
  <text x="75" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Digital Vacuum</text>
  <text x="30" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
    Scrapes images, SVG, HLS audio/video streams, PDF brochures, fonts, and client docs. Bundles into a single instant ZIP in browser memory.
  </text>
  <rect x="30" y="175" width="215" height="26" rx="6" fill="#0369a1" opacity="0.3"/>
  <text x="137" y="192" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">150-PAGE SITEMAP CRAWL</text>

  <!-- Card 2: Security Roast -->
  <rect x="312" y="10" width="275" height="220" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="347" cy="45" r="18" fill="#b91c1c" opacity="0.2"/>
  <text x="347" y="52" fill="#ef4444" font-size="20" text-anchor="middle">🔥</text>
  <text x="377" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Production Roaster</text>
  <text x="332" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
    Finds your forgotten .env, .git folder, SQL dumps, GraphQL introspection, unauthenticated Supabase tables, and AWS/Stripe tokens.
  </text>
  <rect x="332" y="175" width="235" height="26" rx="6" fill="#991b1b" opacity="0.3"/>
  <text x="449" y="192" fill="#f87171" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">READ-ONLY SAFE AUDIT</text>

  <!-- Card 3: Metadata Forensics -->
  <rect x="615" y="10" width="275" height="220" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="650" cy="45" r="18" fill="#6d28d9" opacity="0.2"/>
  <text x="650" y="52" fill="#a78bfa" font-size="20" text-anchor="middle">🕵️‍♂️</text>
  <text x="680" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Metadata Stalker</text>
  <text x="635" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
    Extracts GPS coordinates hidden in uploaded team selfies, author names inside public PDFs, and macros buried in corporate Word docs.
  </text>
  <rect x="635" y="175" width="235" height="26" rx="6" fill="#5b21b6" opacity="0.3"/>
  <text x="752" y="192" fill="#c084fc" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">EXIF &amp; METADATA PURGE</text>
</svg>
