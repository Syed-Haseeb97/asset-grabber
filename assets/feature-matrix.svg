<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- CARD 1: Digital Vacuum -->
  <rect x="20" y="15" width="295" height="230" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="56" cy="50" r="18" fill="#0284c7" opacity="0.25"/>
  <text x="56" y="57" font-size="20" text-anchor="middle">📦</text>
  <text x="88" y="56" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Digital Vacuum</text>
  
  <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
    <tspan x="42" y="96">Scrapes images, vectors, audio,</tspan>
    <tspan x="42" y="118">and HLS (.m3u8) video streams.</tspan>
    <tspan x="42" y="140">Crawls up to 150 sitemap pages</tspan>
    <tspan x="42" y="162">and builds an in-memory ZIP.</tspan>
  </text>
  
  <rect x="42" y="186" width="251" height="32" rx="8" fill="#0369a1" opacity="0.25" stroke="#0284c7" stroke-width="1"/>
  <text x="167" y="206" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.05em">⚡ 150-PAGE SITEMAP CRAWL</text>

  <!-- CARD 2: Production Roaster -->
  <rect x="332" y="15" width="295" height="230" rx="14" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="368" cy="50" r="18" fill="#b91c1c" opacity="0.25"/>
  <text x="368" y="57" font-size="20" text-anchor="middle">🔥</text>
  <text x="400" y="56" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Production Roaster</text>
  
  <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
    <tspan x="354" y="96">Hunts for exposed .env, .git,</tspan>
    <tspan x="354" y="118">SQL dumps, and cloud backups.</tspan>
    <tspan x="354" y="140">Detects unmasked API secrets,</tspan>
    <tspan x="354" y="162">CORS flaws, and open buckets.</tspan>
  </text>
  
  <rect x="354" y="186" width="251" height="32" rx="8" fill="#991b1b" opacity="0.25" stroke="#ef4444" stroke-width="1"/>
  <text x="479" y="206" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.05em">🚨 READ-ONLY SAFE AUDIT</text>

  <!-- CARD 3: Metadata Stalker -->
  <rect x="645" y="15" width="295" height="230" rx="14" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="681" cy="50" r="18" fill="#6d28d9" opacity="0.25"/>
  <text x="681" y="57" font-size="20" text-anchor="middle">🕵️‍♂️</text>
  <text x="713" y="56" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Metadata Stalker</text>
  
  <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
    <tspan x="667" y="96">Pulls hidden GPS coordinates</tspan>
    <tspan x="667" y="118">from uploaded photo EXIF data.</tspan>
    <tspan x="667" y="140">Extracts author &amp; company info</tspan>
    <tspan x="667" y="162">from public PDF &amp; Office docs.</tspan>
  </text>
  
  <rect x="667" y="186" width="251" height="32" rx="8" fill="#5b21b6" opacity="0.25" stroke="#8b5cf6" stroke-width="1"/>
  <text x="792" y="206" fill="#c084fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.05em">🛡️ EXIF &amp; METADATA PURGE</text>
</svg>
